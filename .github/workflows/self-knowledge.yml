name: Self-Knowledge Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  self-knowledge-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run self-knowledge tests
        run: npm test

      - name: Run self-knowledge --refresh (verify it works)
        run: npm run jarvis -- self-knowledge --render > /dev/null 2>&1

      - name: Soft drift check
        run: npm run jarvis -- self-knowledge --check

      - name: Strict drift check
        run: npm run jarvis -- self-knowledge --check --strict
